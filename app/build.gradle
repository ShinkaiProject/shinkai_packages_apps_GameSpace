import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.android.gamespace"
        minSdk 33
        targetSdk 33
        versionCode 100
        versionName "0.2"
    }
    signingConfigs {
        platform {
            storeFile file("platform.jks")
            storePassword 'android'
            keyAlias 'platform'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.platform
        }
        release {
            debuggable true
            signingConfig signingConfigs.platform
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions.jvmTarget = JvmTarget.JVM_1_8
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/java']
        }
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        // The Compose compiler that goes with Kotlin 1.8.10 (see the compatibility map).
        kotlinCompilerExtensionVersion '1.4.3'
    }
    lint {
        disable 'ContentDescription', 'QueryAllPackagesPermission', 'ProtectedPermissions', 'OldTargetApi', 'UseCompatLoadingForDrawables', 'UnsafeProtectedBroadcastReceiver', 'AppCompatCustomView'
    }
}

dependencies {
    compileOnly files(frameworkJar)
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.dagger:hilt-android:2.45'
    kapt 'com.google.dagger:hilt-compiler:2.45'

    // Jetpack Compose + Material 3. The BOM pins ui / foundation / material3 together
    // (2023.05.01 = Compose 1.4.3, Material 3 1.1.0, which matches the compiler above).
    implementation platform('androidx.compose:compose-bom:2023.05.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material:material-ripple'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.7.2'
    // The overlay windows are not hosted by an Activity, so they bring their own lifecycle owner.
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.savedstate:savedstate-ktx:1.2.1'
    // Drawn into a Compose canvas for the illustration at the top of the settings; no View.
    implementation 'com.airbnb.android:lottie:6.0.0'
}

kapt {
    correctErrorTypes true
}
